<body>
  <!-- Helper script for dynamic DOM selector injection to support automation testing framework attributes -->
  <script>
    (function() {
      function tagElements() {
        // 1. Tag Email Fields
        var emailFields = document.querySelectorAll('input[type="email"], input[placeholder*="Email"], [aria-label*="email"] input, [aria-label="email_field"]');
        emailFields.forEach(function(el) {
          var input = el.tagName === 'INPUT' ? el : el.querySelector('input');
          var target = input || el;
          target.id = 'email';
          target.setAttribute('data-testid', 'email-input');
          target.setAttribute('name', 'email');
        });

        // 2. Tag Password Fields
        var passFields = document.querySelectorAll('input[type="password"], input[placeholder*="Password"], [aria-label*="password"] input, [aria-label="password_field"]');
        passFields.forEach(function(el) {
          var input = el.tagName === 'INPUT' ? el : el.querySelector('input');
          var target = input || el;
          target.id = 'password';
          target.setAttribute('data-testid', 'password-input');
          target.setAttribute('name', 'password');
        });

        // 3. Tag Login Button
        var loginBtns = document.querySelectorAll('[aria-label="login_button"], [aria-label*="login"], [aria-label*="signin"]');
        loginBtns.forEach(function(el) {
          el.id = 'login-btn';
          el.setAttribute('data-testid', 'login-btn');
          el.setAttribute('aria-label', 'login_button');
        });

        // 4. Tag Google Button
        var googleBtns = document.querySelectorAll('[aria-label="google-signin-btn"], [aria-label*="google"]');
        googleBtns.forEach(function(el) {
          el.id = 'google-signin-btn';
          el.setAttribute('data-testid', 'google-signin-btn');
          el.setAttribute('aria-label', 'google-signin-btn');
        });

        // 5. Tag Guest Access Button
        var guestBtns = document.querySelectorAll('[aria-label="guest_button"], [aria-label*="guest"]');
        guestBtns.forEach(function(el) {
          el.id = 'guest-access-btn';
          el.setAttribute('data-testid', 'guest-access-btn');
          el.setAttribute('aria-label', 'guest_button');
        });

        // 6. Tag Forgot Password Link
        var forgotBtns = document.querySelectorAll('[aria-label="forgot-password-link"], [aria-label*="forgot"]');
        forgotBtns.forEach(function(el) {
          el.id = 'forgot-password-link';
          el.setAttribute('data-testid', 'forgot-password-link');
          el.setAttribute('aria-label', 'forgot-password-link');
        });

        // 7. Tag Sign Up Link
        var signupBtns = document.querySelectorAll('[aria-label="signup-link"], [aria-label*="signup"], [aria-label*="register"]');
        signupBtns.forEach(function(el) {
          el.id = 'signup-link';
          el.setAttribute('data-testid', 'signup-link');
          el.setAttribute('aria-label', 'signup-link');
        });

        // 8. Tag Dashboard Screen
        var dashboards = document.querySelectorAll('[aria-label="dashboard_screen"], [aria-label*="dashboard"]');
        dashboards.forEach(function(el) {
          el.id = 'dashboard-screen';
          el.setAttribute('data-testid', 'dashboard-screen');
        });
      }

      // Periodically apply tags to catch dynamic client modifications
      setInterval(tagElements, 200);
      window.addEventListener('load', function() {
        tagElements();
        var observer = new MutationObserver(tagElements);
        observer.observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>
