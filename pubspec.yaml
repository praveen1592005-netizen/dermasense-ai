name: derma_sense_ai
description: "DermaSense AI Pro — Production-grade AI Dermatology Platform"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.0

  # State Management
  flutter_riverpod: ^2.4.0

  # UI / Animations
  lottie: ^3.3.3
  flutter_svg: ^2.0.9
  fl_chart: ^0.69.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

  # Image Handling
  image_picker: ^1.0.7
  image: ^4.8.0

  # Networking
  http: ^1.2.0

  # Storage & Permissions
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # PDF Reports
  pdf: ^3.10.8
  printing: ^5.12.0

  # Location & Maps
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  url_launcher: ^6.2.6

  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Notifications & Reminders
  flutter_local_notifications: ^18.0.0

  # Utilities
  intl: ^0.20.2
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  open_file: ^3.5.10

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
