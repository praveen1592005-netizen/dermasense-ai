server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header X-XSS-Protection          "1; mode=block"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=self, microphone=self, geolocation=self" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.dermasense.ai; media-src 'self' blob:; frame-ancestors 'none';"
        always;

    # ─── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ─── SPA Routing (React Router) ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Static Asset Caching ────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Block Sensitive Paths ────────────────────────────────────────────────
    location ~ /\.(env|git|github) {
        deny all;
        return 404;
    }
}
