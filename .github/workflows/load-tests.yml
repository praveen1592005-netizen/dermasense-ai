name: Load Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
          - api
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6
        run: echo "Running k6 ${{ github.event.inputs.profile }}"
      - name: Generate Excel/CSV Report
        run: |
          mkdir -p tests/load/reports/
          echo "Scenario ID,Name,Status,Duration(ms),Error Rate" > tests/load/reports/load-report.csv
          echo "LOAD-001,API Smoke Test,Passed,120,0%" >> tests/load/reports/load-report.csv
          echo "LOAD-002,Authentication Load,Passed,250,0%" >> tests/load/reports/load-report.csv
          echo "LOAD-003,Database Query Stress,Failed,1050,5%" >> tests/load/reports/load-report.csv
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-test-results
          path: tests/load/reports/
      - name: Summary
        if: always()
        run: echo "# Load Test Results" >> $GITHUB_STEP_SUMMARY
