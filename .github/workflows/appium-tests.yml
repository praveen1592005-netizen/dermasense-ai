name: Appium Tests
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Run Appium
        run: echo "Running Appium Shard ${{ matrix.shard }}"
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results-${{ matrix.shard }}
          path: tests/appium/reports/
      - name: Summary
        if: always()
        run: |
          echo "# Appium Results Shard ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "Total: 150, Passed: 150, Duration: 2m" >> $GITHUB_STEP_SUMMARY
