name: DermaSense AI — Appium E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  appium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python test dependencies
        run: |
          pip install Appium-Python-Client selenium openpyxl

      - name: ☕ Set up Java 17 (needed by Appium/UiAutomator2)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 📱 Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🤖 Set up Android SDK & Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Emulator ready — adb devices:"
            adb devices

      - name: 🔧 Install Appium & UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --version

      - name: 🚀 Start Appium server in background
        run: |
          nohup appium --base-path=/wd/hub --log appium.log &
          sleep 5
          echo "Appium server started"

      - name: 📲 Download & Install DermaSense APK
        run: |
          # If the APK is committed in the repo (artifacts/), install it
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            echo "APK installed from build artifacts"
          else
            echo "No pre-built APK found — using existing installed app (noReset=true)"
          fi

      - name: 🧪 Run Appium E2E Tests
        run: |
          python appium_tests/run_tests.py \
            --email "${{ secrets.TEST_EMAIL }}" \
            --password "${{ secrets.TEST_PASSWORD }}" \
            --host 127.0.0.1 \
            --port 4723 \
            --output DermaSense_Test_Report.xlsx

      - name: 📊 Upload Test Report (Excel)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DermaSense-Test-Report-${{ github.run_number }}
          path: DermaSense_Test_Report.xlsx

      - name: 📸 Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DermaSense-Test-Screenshots-${{ github.run_number }}
          path: appium_tests/screenshots/

      - name: 📋 Print Appium Logs on failure
        if: failure()
        run: cat appium.log || echo "No Appium log found"
