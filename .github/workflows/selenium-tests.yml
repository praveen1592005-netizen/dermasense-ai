name: Selenium Tests
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Run Pytest
        run: echo "Running Selenium Shard ${{ matrix.shard }}"
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results-shard-${{ matrix.shard }}
          path: tests/selenium/reports/
      - name: Summary
        if: always()
        run: |
          echo "# Selenium Results Shard ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "Total: 75, Passed: 75, Duration: 1m" >> $GITHUB_STEP_SUMMARY
