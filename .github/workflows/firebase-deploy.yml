# .github/workflows/firebase-deploy.yml
name: Deploy DermaSense AI Web to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java Environment
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2' # matches workspace environment
          channel: 'stable'
          cache: true

      # 4. Install Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Build Flutter Web Release
      - name: Build Web Release
        run: flutter build web --release --no-pub --no-wasm-dry-run

      # 6. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: dermasense-ai-18698
          channelId: live
