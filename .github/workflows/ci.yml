name: DermaSense AI – CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-type-check:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Check for security-sensitive patterns in code
        run: |
          ! grep -rn "console.log.*password\|console.log.*token\|console.log.*aadhaar" src/ || exit 1

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: lint-type-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  production-build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify dist output
        run: |
          test -f dist/index.html || exit 1
          echo "Production build verified."
      - uses: actions/upload-artifact@v4
        with:
          name: dist-production
          path: dist/
          retention-days: 14

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: production-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-production
          path: dist/
      - name: Deploy to hosting platform
        run: |
          echo "Deploy dist/ to configured production host (Vercel / Netlify / Firebase Hosting)"
          echo "Set VITE_API_BASE_URL and other secrets in repository secrets."
